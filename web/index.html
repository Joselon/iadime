<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iadime" />
    <title>iadime web</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-panel">
        <header id="printHeader" class="print-header" aria-hidden="true"></header>
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <textarea id="prompt" placeholder="Escribe tu pregunta o un comando como :help o :reset,..." autocapitalize="sentences" autocorrect="on" autocomplete="on" enterkeyhint="send" inputmode="text" spellcheck="true" virtualkeyboardpolicy="auto"></textarea>
          <input type="file" id="fileInput" accept="image/*,audio/*,video/*,.pdf,.txt,.md" hidden>
          <div class="composer-actions">
            <button type="button" id="keyboardBtn" class="composer-tool-btn" title="Mostrar teclado" aria-label="Mostrar teclado">⌨️</button>
            <button type="button" id="dictateBtn" class="composer-tool-btn" title="Dictado por voz" aria-label="Dictado por voz">🎙️</button>
            <button type="button" id="attachBtn" class="composer-tool-btn" title="Adjuntar archivo" aria-label="Adjuntar archivo">📎</button>
            <button type="submit" id="sendBtn">Enviar</button>
          </div>
        </form>
        <div id="conversationStats" class="conversation-stats" aria-live="polite"></div>
      </section>

      <aside id="sidebar" class="sidebar">
        <h1>iadime</h1>
        <p>Interfaz ligera para conversar con IA desde el navegador.</p>
        <label class="field">
          <span>Proveedor</span>
          <select id="providerSelect">
            <option value="" selected>Selecciona un proveedor</option>
            <option value="openai">OpenAI</option>
            <option value="gemini">Gemini</option>
          </select>
        </label>
        <label class="field">
          <span>Modelo</span>
          <select id="modelSelect" disabled>
            <option value="">Selecciona un proveedor primero</option>
          </select>
        </label>
        <div id="modelInfoCard" class="model-info-card is-hidden" aria-live="polite"></div>
        <button id="clearBtn" type="button">Limpiar conversación</button>
        <button id="exportBtn" type="button">Guardar conversación</button>
        <button id="printBtn" type="button">Imprimir / PDF</button>
        <label class="field">
          <span>Conversación</span>
          <input id="conversationName" type="text" placeholder="mi-hilo" autocapitalize="words" autocorrect="on" autocomplete="on" enterkeyhint="done" inputmode="text" spellcheck="true" virtualkeyboardpolicy="auto" />
        </label>
        <button id="showRulesBtn" type="button" class="conversation-rules-button">Mostrar Reglas de la Conversación</button>
        <div id="conversationRulesPanel" class="conversation-rules-panel is-hidden" aria-live="polite"></div>
        <div id="conversationListCard" class="conversation-list-card is-collapsed">
          <div class="conversation-card-header">
            <h2>Chats guardados</h2>
            <button id="importBtn" type="button" class="conversation-card-toggle" aria-label="Mostrar conversaciones guardadas">⌄</button>
          </div>
          <ul id="conversationList" class="conversation-list"></ul>
        </div>
      </aside>
      <div class="floating-controls">
        <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-expanded="true" aria-controls="sidebar">☰</button>
        <button id="printFab" class="print-fab" type="button" aria-label="Imprimir conversación">⎙</button>
        <button id="scrollBottomBtn" class="scroll-bottom" type="button" aria-label="Ir al final de la conversación">⇩</button>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-highlightjs@4.1.0/dist/markdown-it-highlightjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
